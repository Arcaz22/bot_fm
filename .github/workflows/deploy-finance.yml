name: Deploy Finance Bot

on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!README.md'
      - '!docs/**'
      - '!.gitignore'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker image
        run: |
          IMAGE=${{ secrets.DOCKER_USERNAME }}/finance-bot
          SHA_TAG=${{ github.sha }}
          docker build -t $IMAGE:$SHA_TAG -t $IMAGE:latest .
          docker push $IMAGE:$SHA_TAG
          docker push $IMAGE:latest

      - name: Install cloudflared
        run: |
          curl -L --output /usr/local/bin/cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /usr/local/bin/cloudflared

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.MINI_PC_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Configure SSH over Cloudflare Tunnel
        env:
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          cat <<EOF >> ~/.ssh/config
          Host mini-pc
            HostName ssh.rampung.space
            User ${{ secrets.MINI_PC_USER }}
            IdentityFile ~/.ssh/id_rsa
            StrictHostKeyChecking no
            ProxyCommand cloudflared access ssh --hostname %h --service-token-id $TUNNEL_SERVICE_TOKEN_ID --service-token-secret $TUNNEL_SERVICE_TOKEN_SECRET
          EOF

      - name: Deploy to Mini PC
        run: |
          ssh mini-pc "cd ~/infrastructure && \
            docker compose pull app-finance && \
            docker compose up -d app-finance && \
            docker compose ps app-finance && \
            docker image prune -f && \
            echo '✓ Finance Bot successfully deployed!'"
