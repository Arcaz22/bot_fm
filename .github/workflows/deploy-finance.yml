name: Deploy Finance Bot

on:
  push:
    branches: [main]
    paths:
      - 'apps/finance/**'
      - 'docker-compose.yml'
      - '.github/workflows/deploy-finance.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository dari GitHub
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Login ke Docker Hub menggunakan GitHub Secrets
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 3: Build & Push Image ke Docker Hub
      - name: Build and Push Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/finance-bot:latest ./apps/finance
          docker push ${{ secrets.DOCKER_USERNAME }}/finance-bot:latest

      # Step 4: Perintahkan Mini PC untuk Deploy
      - name: Deploy to Mini PC
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.MINI_PC_HOST }}
          username: ${{ secrets.MINI_PC_USER }}
          key: ${{ secrets.MINI_PC_SSH_KEY }}
          script: |
            cd ~/infrastructure

            # 1. Update konfig file (docker-compose.yml dll)
            git pull origin main

            # 2. Pull image terbaru dari Docker Hub
            docker compose pull app-finance

            # 3. Restart container app-finance
            docker compose up -d app-finance

            # 4. Verifikasi status
            docker compose ps app-finance
            echo "✓ Finance Bot deployed successfully via Docker Hub"
