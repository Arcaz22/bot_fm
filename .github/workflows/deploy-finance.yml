name: Deploy Finance Bot

on:
  push:
    branches: [main] # Otomatis jalan tiap ada push ke branch main repo bot_fm

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build & Push langsung dari root project bot_fm
      - name: Build and Push Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/finance-bot:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/finance-bot:latest

      # Perintahkan Mini PC untuk menarik image baru dari Docker Hub & restart container-nya
      - name: Deploy to Mini PC
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.MINI_PC_HOST }}
          username: ${{ secrets.MINI_PC_USER }}
          key: ${{ secrets.MINI_PC_SSH_KEY }}
          script: |
            cd ~/infrastructure
            docker compose pull app-finance
            docker compose up -d app-finance
            docker compose ps app-finance
            echo "✓ Finance Bot successfully deployed!"
